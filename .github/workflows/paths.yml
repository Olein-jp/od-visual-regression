name: Change Paths
on:
  workflow_call:
    outputs:
      runner:
        value: ${{ jobs.detect.outputs.runner }}
      dispatcher:
        value: ${{ jobs.detect.outputs.dispatcher }}
      wordpress:
        value: ${{ jobs.detect.outputs.wordpress }}
      images:
        value: ${{ jobs.detect.outputs.images }}
      plugin:
        value: ${{ jobs.detect.outputs.plugin }}
permissions:
  contents: read
jobs:
  detect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      runner: ${{ steps.paths.outputs.runner }}
      dispatcher: ${{ steps.paths.outputs.dispatcher }}
      wordpress: ${{ steps.paths.outputs.wordpress }}
      images: ${{ steps.paths.outputs.images }}
      plugin: ${{ steps.paths.outputs.plugin }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - run: node --test infra/cloud/ci-paths.test.mjs
      - id: paths
        run: node infra/scripts/ci-paths.mjs
