name: Plugin Build

on:
  push:
    branches: ['**']
    tags: ['plugin-v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  changes:
    uses: ./.github/workflows/paths.yml
  plugin:
    needs: changes
    if: needs.changes.outputs.plugin == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: 配布ビルドの検証
        run: python3 -m unittest discover -s scripts/tests -p 'test_build_plugin.py'
      - name: プラグイン ZIP の生成
        env:
          PLUGIN_TAG: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
        run: |
          if [ -n "$PLUGIN_TAG" ]; then
            bash scripts/build-plugin.sh --tag "$PLUGIN_TAG"
          else
            bash scripts/build-plugin.sh
          fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: od-visual-regression-plugin
          path: build/od-visual-regression.zip
          if-no-files-found: error
  plugin-result:
    if: always()
    needs: [changes, plugin]
    runs-on: ubuntu-latest
    steps:
      - name: 配布検証の結果を集約
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: node -e 'const jobs=JSON.parse(process.env.RESULTS);if(jobs.changes.result!=="success" || Object.values(jobs).some(job=>!["success","skipped"].includes(job.result)))process.exit(1)'
