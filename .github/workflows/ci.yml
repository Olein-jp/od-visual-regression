name: CI
on:
  push:
  pull_request:
jobs:
  runner:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run schemas:validate
      - run: npm test
  wordpress:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        wordpress: ['latest', '6.7']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '7.4'
          tools: composer:v2
      - run: composer install --no-interaction --prefer-dist
      - run: find wordpress -name '*.php' -print0 | xargs -0 -n1 php -l
      - run: composer lint
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - if: matrix.wordpress == '6.7'
        run: |
          node -e "require('node:fs').writeFileSync('.wp-env.override.json', JSON.stringify({ core: 'WordPress/WordPress#6.7' }))"
      - run: npm run env:start
      - run: npm run env:cli -- eval-file tests/bootstrap.php
      - if: always()
        run: npm run env:stop
