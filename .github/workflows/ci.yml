name: CI
on:
  push:
  pull_request:
jobs:
  runner:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run schemas:validate
      - run: npm run test:contracts
      - run: npm test
  wordpress:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        wordpress: ['latest', '6.7']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '7.4'
          tools: composer:v2
      - run: composer install --no-interaction --prefer-dist
      - run: find wordpress -name '*.php' -print0 | xargs -0 -n1 php -l
      - run: composer lint
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - if: matrix.wordpress == '6.7'
        run: |
          node -e "require('node:fs').writeFileSync('.wp-env.override.json', JSON.stringify({ core: 'WordPress/WordPress#6.7' }))"
      - run: npm run test:contracts
      - run: npm run env:start
      - run: npm run env:cli -- eval-file tests/bootstrap.php
      - run: npm run env:cli -- eval-file tests/content-api.php
      - run: npm run env:cli -- eval-file tests/contracts.php
      - run: npm run env:cli -- eval-file tests/database.php
      - run: npm run env:cli -- eval-file tests/repositories.php
      - run: npm run env:cli -- eval-file tests/storage.php
      - run: npm run env:cli -- eval-file tests/storage-diagnostics.php
      - run: npm run env:cli -- eval-file tests/runs.php
      - run: npm run env:cli -- eval-file tests/retention.php
      - run: npm run env:cli -- eval-file tests/admin-api.php
      - name: MultisiteのDB分離とネットワーク拒否
        run: |
          npx wp-env run tests-cli bash -lc 'wp core multisite-convert --title=ODVR-test --quiet && wp plugin activate od-visual-regression --quiet && wp eval-file wp-content/plugins/od-visual-regression/tests/database-multisite.php && wp eval-file wp-content/plugins/od-visual-regression/tests/repositories.php && wp eval-file wp-content/plugins/od-visual-regression/tests/storage-multisite.php && wp eval-file wp-content/plugins/od-visual-regression/tests/runs-multisite.php && wp eval-file wp-content/plugins/od-visual-regression/tests/retention.php && wp eval-file wp-content/plugins/od-visual-regression/tests/uninstall-multisite.php && wp eval-file wp-content/plugins/od-visual-regression/tests/admin-api.php'
      - if: always()
        run: npm run env:stop
