name: odvr-local
services:
  initialize:
    profiles: [local]
    image: ${ODVR_DISPATCHER_IMAGE:?digest指定のDispatcher Imageを設定してください}
    platform: linux/amd64
    user: '0:0'
    entrypoint: [node, infra/local/initialize.mjs]
    read_only: true
    network_mode: none
    healthcheck:
      test: [CMD, node, -e, "process.exit(require('fs').existsSync('/run/odvr/secrets/.initialized') ? 0:1)"]
      interval: 1s
      timeout: 2s
      retries: 20
    volumes:
      - ${ODVR_LOCAL_INPUT:?local入力directoryを設定してください}:/input:ro
      - configuration:/etc/odvr
      - secrets:/run/odvr/secrets
      - queue:/run/odvr/queue
      - firestore:/data
  firestore:
    profiles: [local]
    image: gcr.io/google.com/cloudsdktool/google-cloud-cli@sha256:09dc038f3c36e664eeeee4b97c8bfb3d107ce26742483a1231f4c6e5b8366d7d
    platform: linux/amd64
    user: '1000:1000'
    entrypoint: [sh, /entry/firestore.sh]
    depends_on:
      initialize: {condition: service_healthy}
    healthcheck:
      test: [CMD, python3, -c, "import socket; socket.create_connection(('127.0.0.1',8085),2).close()"]
      interval: 2s
      timeout: 3s
      retries: 30
    stop_signal: SIGTERM
    init: true
    stop_grace_period: 60s
    mem_limit: 1g
    environment:
      CLOUDSDK_CONFIG: /tmp/gcloud
    tmpfs: ['/tmp:uid=1000,gid=1000,mode=0700']
    networks: [control]
    volumes:
      - firestore:/data
      - ./infra/local/firestore.sh:/entry/firestore.sh:ro
  dispatcher:
    profiles: [local]
    image: ${ODVR_DISPATCHER_IMAGE:?digest指定のDispatcher Imageを設定してください}
    platform: linux/amd64
    read_only: true
    init: true
    depends_on:
      initialize: {condition: service_healthy}
      firestore: {condition: service_healthy}
    environment:
      NODE_EXTRA_CA_CERTS: /etc/odvr/fixture-ca.pem
    volumes:
      - configuration:/etc/odvr:ro
      - secrets:/run/odvr/secrets
      - queue:/run/odvr/queue
    tmpfs: [/tmp]
    networks: [control, wordpress]
    mem_limit: 512m
    cpus: 1
  launcher:
    profiles: [local]
    image: ${ODVR_RUNNER_IMAGE:?digest指定のRunner Imageを設定してください}
    platform: linux/amd64
    read_only: true
    init: true
    entrypoint: [flock, --nonblock, /run/odvr/queue/.launcher.lock, node, infra/local/launcher.mjs]
    depends_on:
      initialize: {condition: service_healthy}
    volumes:
      - configuration:/etc/odvr:ro
      - secrets:/run/odvr/secrets:ro
      - queue:/run/odvr/queue
    tmpfs: ['/tmp:uid=1000,gid=1000,mode=0700,size=256m']
    shm_size: 256m
    networks: [wordpress]
    mem_limit: 2g
    cpus: 2
    stop_grace_period: 15s
  worker:
    profiles: [local]
    image: ${ODVR_DISPATCHER_IMAGE:?digest指定のDispatcher Imageを設定してください}
    platform: linux/amd64
    read_only: true
    init: true
    entrypoint: [node, infra/local/worker.mjs]
    depends_on:
      initialize: {condition: service_healthy}
      dispatcher: {condition: service_started}
    volumes:
      - secrets:/run/odvr/secrets:ro
    tmpfs: [/tmp]
    networks: [control]
  relay:
    profiles: [local]
    image: ${ODVR_DISPATCHER_IMAGE:?digest指定のDispatcher Imageを設定してください}
    platform: linux/amd64
    read_only: true
    init: true
    entrypoint: [node, infra/local/relay.mjs]
    depends_on:
      initialize: {condition: service_healthy}
      dispatcher: {condition: service_started}
    volumes:
      - configuration:/etc/odvr:ro
      - secrets:/run/odvr/secrets:ro
    tmpfs: [/tmp]
    networks:
      control: {}
      wordpress:
        ipv4_address: 172.30.238.20
        aliases: [wordpress.fixture.test, dispatcher.fixture.test]
networks:
  control:
    internal: true
  wordpress:
    external: true
    name: odvr-local-wordpress
volumes:
  configuration: {}
  queue: {}
  firestore: {}
  secrets:
    driver: local
    driver_opts:
      type: tmpfs
      device: tmpfs
      o: size=32m,uid=1000,gid=1000,mode=0700
