# 固定Runner経路だけで生multipartを維持する。
# 既存サイトのパーマリンク設定に依存せず、この経路だけをWordPressへ渡す。
<Directory "/var/www/html">
    RewriteEngine On
    RewriteRule ^wp-json/odvr/v1/runner(/.*)?$ /index.php?rest_route=/odvr/v1/runner$1 [END,QSA]
</Directory>
<Location "/wp-json/odvr/v1/runner">
    LimitRequestBody 44040192
    Header always set X-ODVR-Runner-Gateway "1"
    Header always set X-ODVR-Raw-Multipart "available"
    SetEnvIfNoCase Authorization "^Bearer .+" odvr_bearer=present
    Header always set X-ODVR-Bearer-Header "present" env=odvr_bearer
</Location>
# WordPressのindex.phpへの内部転送後も、元のRunner要求だけへ適用する。
<If "%{THE_REQUEST} =~ m# /wp-json/odvr/v1/runner/#">
    php_flag enable_post_data_reading Off
    php_value memory_limit 1024M
</If>
